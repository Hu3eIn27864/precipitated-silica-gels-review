name: MC3D C++ tests

on:
  push:
    paths:
      - "MODELLING/monte_carlo_3d/**"
      - ".github/workflows/mc3d-ci.yml"
  pull_request:
    paths:
      - "MODELLING/monte_carlo_3d/**"
      - ".github/workflows/mc3d-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S MODELLING/monte_carlo_3d -B build/mc3d -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/mc3d --parallel 2
      - name: Run C++ tests
        run: ctest --test-dir build/mc3d --output-on-failure
      - name: Run Python ensemble-analysis tests
        run: python3 -m unittest discover -s MODELLING/monte_carlo_3d/analysis -p 'test_*.py' -v
      - name: Run 1-D transport model tests
        run: python3 -m unittest discover -s MODELLING/transport_model -p 'test_*.py' -v
      - name: Record pilot provenance
        run: |
          mkdir -p build/mc3d/pilot
          {
            echo "git_commit=$(git rev-parse HEAD)"
            echo "git_ref=$GITHUB_REF"
            echo "runner_os=$RUNNER_OS"
            echo "cmake_version=$(cmake --version | head -n 1)"
            echo "compiler_version=$(c++ --version | head -n 1)"
            echo "python_version=$(python3 --version)"
            echo "particle_sizes=32 64 128"
            echo "seed_start=1000"
            echo "seed_count=3"
            echo "maximum_attempts=50000"
            echo "reference_size=32"
            echo "reference_box=15.0"
            echo "fit_interval=2.0,5.0"
          } > build/mc3d/pilot/provenance.txt
      - name: Run bounded DLCA pilot size series
        run: |
          python3 MODELLING/monte_carlo_3d/analysis/run_dlca_size_series.py \
            --executable build/mc3d/mc3d_dlca_ensemble \
            --output-dir build/mc3d/pilot \
            --sizes 32 64 128 \
            --seed-start 1000 \
            --seed-count 3 \
            --max-attempts 50000
          python3 MODELLING/monte_carlo_3d/analysis/analyze_dlca_ensembles.py \
            --system 32:build/mc3d/pilot/n32 \
            --system 64:build/mc3d/pilot/n64 \
            --system 128:build/mc3d/pilot/n128 \
            --fit-min 2 --fit-max 5 \
            --output build/mc3d/pilot/size_comparison
          python3 MODELLING/monte_carlo_3d/analysis/analyze_dlca_fit_sensitivity.py \
            --system 32:build/mc3d/pilot/n32 \
            --system 64:build/mc3d/pilot/n64 \
            --system 128:build/mc3d/pilot/n128 \
            --output build/mc3d/pilot/size_comparison
      - name: Run bounded paired-seed DLCA parameter sensitivity
        run: |
          python3 MODELLING/monte_carlo_3d/analysis/run_dlca_parameter_sensitivity.py \
            --executable build/mc3d/mc3d_dlca_ensemble \
            --output-dir build/mc3d/parameter_sensitivity \
            --particle-count 32 --seed-start 3000 --seed-count 3 \
            --max-attempts 50000 --reference-box 15.0
          {
            echo "git_commit=$(git rev-parse HEAD)"
            echo "seed_start=3000"
            echo "seed_count=3"
            echo "maximum_attempts=50000"
            echo "particle_count=32"
            echo "reference_box=15.0"
            echo "fit_interval=2.0,5.0 contact-distance units"
            echo "design=paired baseline plus six one-factor variants"
          } > build/mc3d/parameter_sensitivity/provenance.txt
          for variant in baseline contact_0p9 contact_1p1 step_0p1 step_0p28 mobility_0p5 mobility_1p5; do
            prefix="build/mc3d/parameter_sensitivity/$variant/n32"
            python3 MODELLING/monte_carlo_3d/analysis/analyze_dlca_ensembles.py \
              --system "32:$prefix" --fit-min 2 --fit-max 5 \
              --output "build/mc3d/parameter_sensitivity/$variant/summary"
            python3 MODELLING/monte_carlo_3d/analysis/analyze_dlca_fit_sensitivity.py \
              --system "32:$prefix" \
              --output "build/mc3d/parameter_sensitivity/$variant/summary"
          done
          python3 MODELLING/monte_carlo_3d/analysis/compare_dlca_parameter_sensitivity.py \
            --baseline "32:build/mc3d/parameter_sensitivity/baseline/n32" \
            --variant "contact_0p9=32:build/mc3d/parameter_sensitivity/contact_0p9/n32" \
            --variant "contact_1p1=32:build/mc3d/parameter_sensitivity/contact_1p1/n32" \
            --variant "step_0p1=32:build/mc3d/parameter_sensitivity/step_0p1/n32" \
            --variant "step_0p28=32:build/mc3d/parameter_sensitivity/step_0p28/n32" \
            --variant "mobility_0p5=32:build/mc3d/parameter_sensitivity/mobility_0p5/n32" \
            --variant "mobility_1p5=32:build/mc3d/parameter_sensitivity/mobility_1p5/n32" \
            --fit-min 2 --fit-max 5 \
            --output build/mc3d/parameter_sensitivity/paired_comparison
      - name: Upload pilot and sensitivity data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc3d-dlca-pilot-and-sensitivity
          path: |
            build/mc3d/pilot/
            build/mc3d/parameter_sensitivity/
          if-no-files-found: warn
