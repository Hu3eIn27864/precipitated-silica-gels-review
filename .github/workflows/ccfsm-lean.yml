name: CCFSM P27.37 Lean proof kernel

on:
  push:
    paths:
      - "lean/**"
      - ".github/workflows/ccfsm-lean.yml"
  pull_request:
    paths:
      - "lean/**"
      - ".github/workflows/ccfsm-lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Lean
        uses: leanprover/lean-action@v1
      - name: Build formal kernel
        working-directory: lean
        run: lake build
