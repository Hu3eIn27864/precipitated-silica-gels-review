name: CCFSM P27.37 Lean proof kernel

on:
  push:
    paths:
      - "lean/**"
      - ".github/workflows/ccfsm-lean.yml"
  pull_request:
    paths:
      - "lean/**"
      - ".github/workflows/ccfsm-lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install elan and pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.35.0
      - name: Resolve Lake workspace and build formal kernel
        working-directory: lean
        run: |
          lake update
          lake build
