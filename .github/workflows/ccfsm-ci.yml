name: CCFSM natural-syneresis tests

on:
  push:
    paths:
      - "MODELLING/ccfsm/**"
      - ".github/workflows/ccfsm-ci.yml"
  pull_request:
    paths:
      - "MODELLING/ccfsm/**"
      - ".github/workflows/ccfsm-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ccfsm-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run CCFSM unit tests
        run: python -m unittest discover -s MODELLING/ccfsm -p "test_*.py" -v
