name: CCFSM natural-syneresis tests

on:
  push:
    paths:
      - "MODELLING/ccfsm/**"
      - "DATA/Raw/kurvendigitalisierung.csv"
      - "LITERATURE/wilhelm_kind_approximate_measurement_points_curated.csv"
      - ".github/workflows/ccfsm-ci.yml"
  pull_request:
    paths:
      - "MODELLING/ccfsm/**"
      - "DATA/Raw/kurvendigitalisierung.csv"
      - ".github/workflows/ccfsm-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ccfsm-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run CCFSM unit tests
        run: python -m unittest discover -s MODELLING/ccfsm -p "test_*.py" -v
      - name: Run v0.5 natural-syneresis calibration
        run: |
          python MODELLING/ccfsm/ccfsm_v05_calibration.py \
            --input LITERATURE/wilhelm_kind_approximate_measurement_points_curated.csv \
            --pressure-audit DATA/Raw/kurvendigitalisierung.csv \
            --output-dir ccfsm-v05-results
      - name: Run branch-separated natural-syneresis sensitivity analysis
        run: |
          python MODELLING/ccfsm/ccfsm_v05_branch_sensitivity.py \\
            --input LITERATURE/wilhelm_kind_approximate_measurement_points_curated.csv \\
            --output ccfsm-v05-results/wilhelm_kind_branch_sensitivity.csv
      - name: Upload v0.5 calibration results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-v0.5-natural-syneresis-results
          path: ccfsm-v05-results/
          if-no-files-found: error
          retention-days: 30
