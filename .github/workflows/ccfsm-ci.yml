name: CCFSM natural-syneresis tests

on:
  push:
    paths:
      - "MODELLING/ccfsm/**"
      - "DATA/Raw/kurvendigitalisierung.csv"
      - "LITERATURE/wilhelm_kind_approximate_measurement_points_curated.csv"
      - ".github/workflows/ccfsm-ci.yml"
  pull_request:
    paths:
      - "MODELLING/ccfsm/**"
      - "DATA/Raw/kurvendigitalisierung.csv"
      - ".github/workflows/ccfsm-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ccfsm-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run CCFSM unit tests
        run: python -m unittest discover -s MODELLING/ccfsm -p "test_*.py" -v
      - name: Run v0.5 natural-syneresis calibration
        run: |
          python MODELLING/ccfsm/ccfsm_v05_calibration.py \
            --input LITERATURE/wilhelm_kind_approximate_measurement_points_curated.csv \
            --pressure-audit DATA/Raw/kurvendigitalisierung.csv \
            --output-dir ccfsm-v05-results
      - name: Run branch-separated natural-syneresis sensitivity analysis
        run: |
          python MODELLING/ccfsm/ccfsm_v05_branch_sensitivity.py \
            --input LITERATURE/wilhelm_kind_approximate_measurement_points_curated.csv \
            --output ccfsm-v05-results/wilhelm_kind_branch_sensitivity.csv
      - name: Run P25 time-space refinement and solver robustness study
        run: python MODELLING/ccfsm/ccfsm_p25_refinement_study.py --output-dir ccfsm-p25-results
      - name: Upload P25 refinement results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p25-refinement-results
          path: ccfsm-p25-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P25.1 conservative cross-mesh refinement study
        run: python MODELLING/ccfsm/ccfsm_p25_1_refinement_study.py --output-dir ccfsm-p25-1-results
      - name: Upload P25.1 cross-mesh results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p25-1-crossmesh-results
          path: ccfsm-p25-1-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26 conservative nonmatching-mesh projection
        run: python MODELLING/ccfsm/ccfsm_p26_conservative_projection.py --output-dir ccfsm-p26-results
      - name: Run P26.1 moment-preserving projection
        run: python MODELLING/ccfsm/ccfsm_p26_1_moment_projection.py --output-dir ccfsm-p26-1-results
      - name: Upload P26.1 moment-projection results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-1-moment-projection-results
          path: ccfsm-p26-1-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.2 quadratic moment projection
        run: python MODELLING/ccfsm/ccfsm_p26_2_quadratic_projection.py --output-dir ccfsm-p26-2-results
      - name: Upload P26.2 quadratic projection results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-2-quadratic-projection-results
          path: ccfsm-p26-2-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.3 refinement and sensitivity study
        run: python MODELLING/ccfsm/ccfsm_p26_3_refinement_study.py --output-dir ccfsm-p26-3-results
      - name: Upload P26.3 refinement results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-3-refinement-results
          path: ccfsm-p26-3-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.4 positive target reconstruction
        run: python MODELLING/ccfsm/ccfsm_p26_4_positive_target.py --output-dir ccfsm-p26-4-results
      - name: Upload P26.4 positive target results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-4-positive-target-results
          path: ccfsm-p26-4-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.5 optimal positive projection
        run: python MODELLING/ccfsm/ccfsm_p26_5_optimal_positive_projection.py --output-dir ccfsm-p26-5-results
      - name: Upload P26.5 optimal positive projection results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-5-optimal-positive-projection-results
          path: ccfsm-p26-5-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.6 globally coupled positive projection
        run: python MODELLING/ccfsm/ccfsm_p26_6_global_positive_projection.py --output-dir ccfsm-p26-6-results
      - name: Upload P26.6 global positive projection results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-6-global-positive-projection-results
          path: ccfsm-p26-6-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.7 dual feasibility diagnostic
        run: python MODELLING/ccfsm/ccfsm_p26_7_dual_feasibility.py --output-dir ccfsm-p26-7-results
      - name: Upload P26.7 dual feasibility results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-7-dual-feasibility-results
          path: ccfsm-p26-7-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.8 verified dual certificates
        run: python MODELLING/ccfsm/ccfsm_p26_8_verified_dual_certificate.py --output-dir ccfsm-p26-8-results
      - name: Upload P26.8 verified dual certificate results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-8-verified-dual-certificates
          path: ccfsm-p26-8-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.9 primal-dual feasibility decision
        run: python MODELLING/ccfsm/ccfsm_p26_9_primal_dual_feasibility.py --output-dir ccfsm-p26-9-results
      - name: Upload P26.9 primal-dual feasibility results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-9-primal-dual-feasibility-results
          path: ccfsm-p26-9-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.10 exact rational moment witness study
        run: python MODELLING/ccfsm/ccfsm_p26_10_exact_moment_witness.py --output-dir ccfsm-p26-10-results
      - name: Upload P26.10 exact moment witness results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-10-exact-moment-witness-results
          path: ccfsm-p26-10-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.11 all-pair exact moment witness study
        run: python MODELLING/ccfsm/ccfsm_p26_11_all_pair_exact_witness.py --output-dir ccfsm-p26-11-results
      - name: Upload P26.11 all-pair exact moment witness results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-11-all-pair-exact-witness-results
          path: ccfsm-p26-11-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.12 exact affine parameterization study
        run: python MODELLING/ccfsm/ccfsm_p26_12_exact_affine_parameterization.py --output-dir ccfsm-p26-12-results
      - name: Upload P26.12 exact affine parameterization results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-12-exact-affine-parameterization-results
          path: ccfsm-p26-12-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.13 exact Markov-Lukacs conic certificates
        run: python MODELLING/ccfsm/ccfsm_p26_13_markov_lukacs_socp.py
      - name: Run P26.13 Markov-Lukacs unit tests
        run: python -m unittest discover -s MODELLING/ccfsm -p 'test_ccfsm_p26_13_markov_lukacs_socp.py' -v
      - name: Run P26.14 global convex feasibility study
        run: python MODELLING/ccfsm/ccfsm_p26_14_global_convex_feasibility.py
      - name: Run P26.14 global convex feasibility unit tests
        run: python -m unittest discover -s MODELLING/ccfsm -p 'test_ccfsm_p26_14_global_convex_feasibility.py' -v
      - name: Run P26.15 global primal-dual study
        run: python MODELLING/ccfsm/ccfsm_p26_15_global_primal_dual.py --output-dir ccfsm-p26-15-results
      - name: Upload P26.15 global primal-dual results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-15-global-primal-dual-results
          path: ccfsm-p26-15-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.15 global primal-dual unit tests
        run: python -m unittest discover -s MODELLING/ccfsm -p 'test_ccfsm_p26_15_global_primal_dual.py' -v
      - name: Run P26.16 dual search stability study
        run: python MODELLING/ccfsm/ccfsm_p26_16_dual_search_stability.py --output-dir ccfsm-p26-16-results
      - name: Upload P26.16 dual search stability results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-16-dual-search-stability-results
          path: ccfsm-p26-16-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.16 dual search stability unit tests
        run: python -m unittest discover -s MODELLING/ccfsm -p 'test_ccfsm_p26_16_dual_search_stability.py' -v
      - name: Run P26.17 reproducible certificate study
        run: python MODELLING/ccfsm/ccfsm_p26_17_certificate_study.py --output-dir ccfsm-p26-17-results
      - name: Upload P26.17 certificate reports
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-17-independent-certificate-reports
          path: ccfsm-p26-17-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.17 independent certificate unit tests
        run: python -m unittest discover -s MODELLING/ccfsm -p 'test_ccfsm_p26_17_independent_certificate.py' -v
      - name: Upload P26 projection results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-conservative-projection-results
          path: ccfsm-p26-results/
          if-no-files-found: error
          retention-days: 30
      - name: Upload v0.5 calibration results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-v0.5-natural-syneresis-results
          path: ccfsm-v05-results/
          if-no-files-found: error
          retention-days: 30

      - name: Run P26.18 cross-partition equivalence study
        run: python MODELLING/ccfsm/ccfsm_p26_18_mesh_equivalence_study.py --output-dir ccfsm-p26-18-results
      - name: Upload P26.18 equivalence results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-18-mesh-equivalence-results
          path: ccfsm-p26-18-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.18 mesh equivalence unit tests
        run: python -m unittest discover -s MODELLING/ccfsm -p 'test_ccfsm_p26_18_mesh_equivalence.py' -v

      - name: Run P26.19 exact profile restriction study
        run: python MODELLING/ccfsm/ccfsm_p26_19_profile_restriction_study.py --output-dir ccfsm-p26-19-results
      - name: Upload P26.19 profile restriction results
        uses: actions/upload-artifact@v4
        with:
          name: ccfsm-p26-19-exact-profile-restriction-results
          path: ccfsm-p26-19-results/
          if-no-files-found: error
          retention-days: 30
      - name: Run P26.19 exact profile restriction unit tests
        run: python -m unittest discover -s MODELLING/ccfsm -p 'test_ccfsm_p26_19_exact_profile_restriction.py' -v
